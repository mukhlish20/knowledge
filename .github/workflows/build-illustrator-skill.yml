name: Build Illustrator Skill ZIP

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate Illustrator SKILL.md frontmatter
        shell: python
        run: |
          from pathlib import Path
          p = Path('illustrator/SKILL.md')
          if not p.exists():
              raise SystemExit('illustrator/SKILL.md is missing')
          lines = p.read_text(encoding='utf-8').splitlines()
          if not lines or lines[0].strip() != '---':
              raise SystemExit('SKILL.md must start with ---')
          try:
              end = lines.index('---', 1)
          except ValueError:
              raise SystemExit('SKILL.md frontmatter closing --- is missing')
          fm = lines[1:end]
          if not any(x.strip() == 'name: ilustrator' for x in fm):
              raise SystemExit('SKILL.md must contain name: ilustrator')
          if not any(x.strip().startswith('description:') and x.split(':',1)[1].strip() for x in fm):
              raise SystemExit('SKILL.md must contain a non-empty description')

      - name: Build Illustrator package
        shell: python
        run: |
          import shutil, zipfile
          from pathlib import Path
          root = Path.cwd()
          out = root / 'dist' / 'ilustrator'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          for rel in ['SKILL.md', 'references/ILLUSTRATOR_GUIDE.md']:
              src = root / 'illustrator' / rel
              if not src.exists(): raise SystemExit(f'Missing required file: {src}')
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          zip_path = root / 'dist' / 'ilustrator.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file(): z.write(p, p.relative_to(root / 'dist'))

      - name: Verify Illustrator package
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          p = Path('dist/ilustrator.zip')
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              expected = {'ilustrator/SKILL.md', 'ilustrator/references/ILLUSTRATOR_GUIDE.md'}
              if names != expected:
                  raise SystemExit(f'Unexpected package contents: {sorted(names)}')
              skill = z.read('ilustrator/SKILL.md').decode('utf-8')
              if not skill.startswith('---\n') or 'name: ilustrator' not in skill:
                  raise SystemExit('Illustrator SKILL.md verification failed')
          print('Illustrator package verification passed')

      - name: Upload Illustrator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ilustrator
          path: dist/ilustrator.zip
          retention-days: 30
