name: Build Skill ZIP

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        shell: python
        run: |
          from pathlib import Path
          text = Path('SKILL.md').read_text(encoding='utf-8')
          lines = text.splitlines()
          if not lines or lines[0].strip() != '---':
              raise SystemExit('SKILL.md must start with YAML frontmatter delimiter ---')
          try:
              end = lines.index('---', 1)
          except ValueError:
              raise SystemExit('SKILL.md frontmatter closing delimiter --- is missing')
          if not any(line.strip().startswith('name:') and line.split(':', 1)[1].strip() == 'komikus' for line in lines[1:end]):
              raise SystemExit('SKILL.md frontmatter must contain name: komikus')
          if not any(line.strip().startswith('description:') and line.split(':', 1)[1].strip() for line in lines[1:end]):
              raise SystemExit('SKILL.md frontmatter must contain a non-empty description')
          print('SKILL.md frontmatter validation passed')

      - name: Build distributable package
        shell: python
        run: |
          import shutil, zipfile
          from pathlib import Path

          root = Path.cwd()
          out = root / 'dist' / 'children-comic-generator'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          for rel in ['SKILL.md', 'references/KNOWLEDGE_MAP.md']:
              src = root / rel
              if not src.exists():
                  raise SystemExit(f'Required file missing: {rel}')
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          zip_path = root / 'dist' / 'children-comic-generator.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root / 'dist'))
          print(zip_path)

      - name: Verify package contents
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          zip_path = Path('dist/children-comic-generator.zip')
          with zipfile.ZipFile(zip_path) as z:
              names = set(z.namelist())
              expected = {
                  'children-comic-generator/SKILL.md',
                  'children-comic-generator/references/KNOWLEDGE_MAP.md',
              }
              if names != expected:
                  raise SystemExit(f'Unexpected package contents: {sorted(names)}')
              skill = z.read('children-comic-generator/SKILL.md').decode('utf-8')
              if not skill.startswith('---\n') or 'name: komikus' not in skill:
                  raise SystemExit('Packaged SKILL.md frontmatter verification failed')
          print('Package contents verification passed: SKILL.md + KNOWLEDGE_MAP.md only')

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: children-comic-generator
          path: dist/children-comic-generator.zip
          retention-days: 30
